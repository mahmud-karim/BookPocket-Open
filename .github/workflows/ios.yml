name: iOS tests and device package
on:
  push:
    branches: [main]
    paths: ['ios/**', 'tests/fixtures/**', 'scripts/verify_ipa.py', 'scripts/select_xcode.py', 'scripts/select_simulator.py', 'scripts/boot_simulator.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'tests/fixtures/**', 'scripts/verify_ipa.py', 'scripts/select_xcode.py', 'scripts/select_simulator.py', 'scripts/boot_simulator.py', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      macos_runner:
        description: 'Mac runner pool (Intel fallback for hosted runner capacity failures)'
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
      ui_scope:
        description: 'Primary iPhone UI coverage (compact coverage is always complete)'
        type: choice
        options: [full, connection, reader]
        default: full
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 60
    env:
      UI_TEST_SCOPE: ${{ inputs.ui_scope || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/select_xcode.py
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - id: device
        run: |
          set -euo pipefail
          DEVICE=$(python3 scripts/select_simulator.py --report artifacts/primary-device.json)
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - id: compact
        name: Select an installed compact iPhone
        run: |
          set -euo pipefail
          DEVICE=$(python3 scripts/select_simulator.py --compact --exclude '${{ steps.device.outputs.id }}' --report artifacts/compact-device.json)
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Compile simulator app and tests
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version
          xcodebuild build-for-testing -project ios/BookPocketOpen.xcodeproj -scheme BookPocketOpen \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Simulator" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- | tee artifacts/simulator-compile.log
      - name: Boot simulator
        timeout-minutes: 10
        run: python3 scripts/boot_simulator.py '${{ steps.device.outputs.id }}'
      - name: Run unit and UI tests
        timeout-minutes: 25
        run: |
          set -euo pipefail
          TEST_FILTERS=()
          if [ "$UI_TEST_SCOPE" = connection ]; then
            TEST_FILTERS=(
              -only-testing:BookPocketOpenTests
              -only-testing:BookPocketOpenUITests/ReaderUITests/testCompanionAddressChangeVerifiesBeforeReplacingPairing
              -only-testing:BookPocketOpenUITests/ReaderUITests/testConnectionTabShowsVerifiedStatusAndKeepsPairing
              -only-testing:BookPocketOpenUITests/ReaderUITests/testConnectionOfflineForgetAndPairingEntry
              -only-testing:BookPocketOpenUITests/ReaderUITests/testConnectionSettingsRemainReachableAtLargestTextSize
              -only-testing:BookPocketOpenUITests/ReaderUITests/testNarrationMiniPlayerLeavesNativeTabsVisibleAndUsable
              -only-testing:BookPocketOpenUITests/ReaderUITests/testStartCompanionVerifiesReadinessAndFitsScreen
              -only-testing:BookPocketOpenUITests/ReaderUITests/testStartCompanionFailureKeepsUnavailableAndPairing
            )
          fi
          if [ "$UI_TEST_SCOPE" = reader ]; then
            TEST_FILTERS=(
              -only-testing:BookPocketOpenTests
              -only-testing:BookPocketOpenUITests/ReaderUITests/testContinuousPageRecordingShowsTotalTimeAndSeeksAcrossPassages
              -only-testing:BookPocketOpenUITests/ReaderUITests/testContinuousRecordingTimelineFitsLargestTextSizes
              -only-testing:BookPocketOpenUITests/ReaderUITests/testDownloadedAudioFitsOneScreenAndSelectsOfflineChapters
              -only-testing:BookPocketOpenUITests/ReaderUITests/testSavedPageClipsPlayWithoutChapterAndPlayerReachesBottomEdge
              -only-testing:BookPocketOpenUITests/ReaderUITests/testMatchingAudioRequiresExplicitAlternateTakeInsteadOfMissingMessage
              -only-testing:BookPocketOpenUITests/ReaderUITests/testReaderPlayerKeepsNarratorsAndOfflineTakesSeparate
              -only-testing:BookPocketOpenUITests/ReaderUITests/testLargestDynamicTypeKeepsListenAndReaderControlsUsable
              -only-testing:BookPocketOpenUITests/ReaderUITests/testCurrentPageNarrationCapturesRealEPUBBeforePresentingSheet
            )
          fi
          xcodebuild test-without-building -project ios/BookPocketOpen.xcodeproj -scheme BookPocketOpen \
            -destination 'platform=iOS Simulator,id=${{ steps.device.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/Simulator" -parallel-testing-enabled NO \
            ${TEST_FILTERS[@]+"${TEST_FILTERS[@]}"} \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 -resultBundlePath artifacts/Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- | tee artifacts/simulator-tests.log
          if [ "$UI_TEST_SCOPE" = connection ]; then
            for TEST in testCompanionAddressChangeVerifiesBeforeReplacingPairing testConnectionTabShowsVerifiedStatusAndKeepsPairing testConnectionOfflineForgetAndPairingEntry testConnectionSettingsRemainReachableAtLargestTextSize testNarrationMiniPlayerLeavesNativeTabsVisibleAndUsable testStartCompanionVerifiesReadinessAndFitsScreen testStartCompanionFailureKeepsUnavailableAndPairing; do
              grep -E "Test Case.*$TEST.*passed" artifacts/simulator-tests.log
            done
          fi
          if [ "$UI_TEST_SCOPE" = reader ]; then
            for TEST in testContinuousPageRecordingShowsTotalTimeAndSeeksAcrossPassages testContinuousRecordingTimelineFitsLargestTextSizes testDownloadedAudioFitsOneScreenAndSelectsOfflineChapters testSavedPageClipsPlayWithoutChapterAndPlayerReachesBottomEdge testMatchingAudioRequiresExplicitAlternateTakeInsteadOfMissingMessage testReaderPlayerKeepsNarratorsAndOfflineTakesSeparate testLargestDynamicTypeKeepsListenAndReaderControlsUsable testCurrentPageNarrationCapturesRealEPUBBeforePresentingSheet; do
              grep -E "Test Case.*$TEST.*passed" artifacts/simulator-tests.log
            done
          fi
      - name: Capture test evidence
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl io '${{ steps.device.outputs.id }}' screenshot artifacts/final-screen.png || true
          xcrun xcresulttool export attachments --path artifacts/Tests.xcresult --output-path artifacts/screenshots || true
          xcrun xcresulttool export diagnostics --path artifacts/Tests.xcresult --output-path artifacts/diagnostics || true
      - name: Boot compact iPhone
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown '${{ steps.device.outputs.id }}' || true
          python3 scripts/boot_simulator.py '${{ steps.compact.outputs.id }}'
      - name: Verify reader and Listen controls on compact iPhone
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project ios/BookPocketOpen.xcodeproj -scheme BookPocketOpen \
            -destination 'platform=iOS Simulator,id=${{ steps.compact.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/Simulator" -parallel-testing-enabled NO \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testListenFitsOneScreenAndSelectsChapters \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testDownloadedAudioFitsOneScreenAndSelectsOfflineChapters \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testLargestDynamicTypeKeepsListenAndReaderControlsUsable \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testReaderPlayerKeepsNarratorsAndOfflineTakesSeparate \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testContinuousPageRecordingShowsTotalTimeAndSeeksAcrossPassages \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testContinuousRecordingTimelineFitsLargestTextSizes \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testSavedPageClipsPlayWithoutChapterAndPlayerReachesBottomEdge \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testMatchingAudioRequiresExplicitAlternateTakeInsteadOfMissingMessage \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testCurrentPageNarrationCapturesRealEPUBBeforePresentingSheet \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testConnectionTabShowsVerifiedStatusAndKeepsPairing \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testConnectionOfflineForgetAndPairingEntry \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testConnectionSettingsRemainReachableAtLargestTextSize \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testStartCompanionVerifiesReadinessAndFitsScreen \
            -only-testing:BookPocketOpenUITests/ReaderUITests/testStartCompanionFailureKeepsUnavailableAndPairing \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 -resultBundlePath artifacts/CompactListen.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- | tee artifacts/compact-tests.log
          # A typo in a filtered test name must never pass without exercising the UI.
          grep -E 'Test Case.*testListenFitsOneScreenAndSelectsChapters.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testDownloadedAudioFitsOneScreenAndSelectsOfflineChapters.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testLargestDynamicTypeKeepsListenAndReaderControlsUsable.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testReaderPlayerKeepsNarratorsAndOfflineTakesSeparate.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testContinuousPageRecordingShowsTotalTimeAndSeeksAcrossPassages.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testContinuousRecordingTimelineFitsLargestTextSizes.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testSavedPageClipsPlayWithoutChapterAndPlayerReachesBottomEdge.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testMatchingAudioRequiresExplicitAlternateTakeInsteadOfMissingMessage.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testCurrentPageNarrationCapturesRealEPUBBeforePresentingSheet.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testConnectionTabShowsVerifiedStatusAndKeepsPairing.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testConnectionOfflineForgetAndPairingEntry.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testConnectionSettingsRemainReachableAtLargestTextSize.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testStartCompanionVerifiesReadinessAndFitsScreen.*passed' artifacts/compact-tests.log
          grep -E 'Test Case.*testStartCompanionFailureKeepsUnavailableAndPairing.*passed' artifacts/compact-tests.log
      - name: Capture compact Listen evidence
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl io '${{ steps.compact.outputs.id }}' screenshot artifacts/compact-final-screen.png || true
          xcrun xcresulttool export attachments --path artifacts/CompactListen.xcresult --output-path artifacts/compact-screenshots || true
          xcrun xcresulttool export diagnostics --path artifacts/CompactListen.xcresult --output-path artifacts/compact-diagnostics || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: artifacts/
          retention-days: 3
  device:
    needs: simulator
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/select_xcode.py
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build iPhoneOS product
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version
          xcodebuild build -project ios/BookPocketOpen.xcodeproj -scheme BookPocketOpen \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Device" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee artifacts/device-build.log
      - name: Package and verify unsigned ARM64 IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Device/Build/Products/Release-iphoneos/BookPocketOpen.app"
          test -f "$APP/BookPocketOpen"
          mkdir -p "$RUNNER_TEMP/Package/Payload"
          ditto "$APP" "$RUNNER_TEMP/Package/Payload/BookPocketOpen.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Package/Payload" artifacts/BookPocketOpen.ipa
          cd artifacts
          shasum -a 256 BookPocketOpen.ipa > BookPocketOpen.ipa.sha256
          VERSION=$(sed -n "s/.*MARKETING_VERSION: '\([^']*\)'.*/\1/p" ../ios/project.yml)
          test -n "$VERSION"
          python3 ../scripts/verify_ipa.py BookPocketOpen.ipa --version "$VERSION" --report ipa-verification.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-package
          path: artifacts/
          retention-days: 3


