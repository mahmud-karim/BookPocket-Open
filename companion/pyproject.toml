[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bookpocket-companion"
version = "0.1.16"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "python-multipart>=0.0.18", "cryptography>=43", "pydantic>=2.10,<3", "defusedxml>=0.7", "qrcode[pil]>=8", "pystray>=0.19; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28", "numpy>=2,<3"]

[project.scripts]
bookpocket = "bookpocket_companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
